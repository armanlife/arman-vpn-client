# A release tag v<version> (the version in app/pubspec.yaml, the same tag
# .github/workflows/build.yml publishes as a GitHub release) builds the
# headless core image and publishes it to GHCR. Image tags:
#   <version>  v<version>  <major>.<minor>  <major>  latest
# "Run workflow" builds without pushing unless Push is checked, and then
# the tags are <version>-edge and edge, not latest.
#
# The image is the Linux core only (SOCKS5/HTTP proxy and the web panel).
# amd64 and arm64. armv7 stays the OpenWrt tarball from the GitHub release.
name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: Push the image as edge
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version and tags
        id: version
        run: |
          set -euo pipefail
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          [ -n "$v" ]
          go="$(awk '/^go /{print $2; exit}' core/go.mod)"
          [ -n "$go" ]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$v"
            echo "go=$go"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$v" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match app/pubspec.yaml ($v)"
              exit 1
            fi
            major="${v%%.*}"
            minor="${v%.*}"
            {
              echo "push=true"
              echo "tags<<EOF"
              echo "$image:$v"
              echo "$image:v$v"
              echo "$image:$minor"
              echo "$image:$major"
              echo "$image:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            push=false
            if [ "${{ inputs.push }}" = "true" ]; then
              push=true
            fi
            {
              echo "push=$push"
              echo "tags<<EOF"
              echo "$image:$v-edge"
              echo "$image:edge"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push false with more than one platform cannot load the image into
      # the runner's Docker. cacheonly still compiles both architectures.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.tags }}
          outputs: ${{ steps.version.outputs.push == 'true' && 'type=registry' || 'type=cacheonly' }}
          build-args: |
            GO_VERSION=${{ steps.version.outputs.go }}
            VERSION=${{ steps.version.outputs.version }}
            SOURCE=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
